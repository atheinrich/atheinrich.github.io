<!-- Homepage

    Basic idea of the html+css+js ecosystem:

    - HTML creates elements
    -- Some terms are built-in tags, like body, head, and title
    -- Others are custom ids, like id="canvas"

    - CSS selects elements and applies styles
    -- It can select elements by built-in tag, id, or class

    - JavaScript finds and manipulates elements
    -- It can select elements by their id, class, or tag name
-->


<!-- This preamble sets up the basic structure of the HTML document -->
<!DOCTYPE html>
<html lang="en">

<!-- Head is the section that contains meta information about the document -->
<head>

    <!-- These tags tell the browser what to do with the page -->
	<meta charset="UTF-8">

    <!-- Viewport is used to control the layout on mobile browsers -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title is the name of the page that appears in the browser tab -->
    <title>
        Welcome
    </title>

    <!-- Link is used to link external resources like CSS files -->
    <!-- Stylesheet is a keyword for linking CSS files -->
    <link rel="stylesheet" href="css/style.css">

</head>

<!-- Body is the section that contains the actual content of the page -->
<body>

    <!-- Canvas is an abstract container for drawing graphics -->
	<canvas id="sand-screen"></canvas>

    <!-- Script is used to include external JavaScript files -->
	<script src="js/sand.js"></script>
    
</body>

</html>
